            Все права защищены
        </p>
    </footer>

</html>




<script>
const urlParams = new URLSearchParams(window.location.search);
const currentId = urlParams.get('id');
const firsticon = document.getElementById("firstabilityicon")
const video = document.getElementById("video")
const secondicon = document.getElementById("secondabilityicon")
const thirdicon = document.getElementById("thirdabilityicon")
const ultimateicon = document.getElementById("fourthabilityicon")
const heroicon = document.getElementById("heroicon")
    const database = {
        "alchemist" : {
            heroicon: "icons/alchemist.png",

            firsticonsrc: "icons/alchemist_acid_spray.png",
            secondiconsrc: "icons/alchemist_unstable_concoction.png",
            thirdconsrc: "icons/alchemist_corrosive_weaponry.png",
            ultimateiconsrc: "icons/alchemist_chemical_rage.png",

            firstabilityvideo: "https://cdn.steamstatic.com/apps/dota2/videos/dota_react/abilities/alchemist/alchemist_acid_spray.webm",
            secondabilityvideo: "https://cdn.steamstatic.com/apps/dota2/videos/dota_react/abilities/alchemist/alchemist_unstable_concoction.webm",
            thirdabilityvideo: "https://cdn.steamstatic.com/apps/dota2/videos/dota_react/abilities/alchemist/alchemist_corrosive_weaponry.webm",
            ultimateabilityvideo: "https://cdn.steamstatic.com/apps/dota2/videos/dota_react/abilities/alchemist/alchemist_chemical_rage.webm"
        
        },
        "axe" : {
            firsticonsrc: "icons/axe_berserkers_call.png"
        }
  
  
    }
if (database[currentId]) {
    firsticon.src = database[currentId].firsticonsrc
    secondicon.src = database[currentId].secondiconsrc
    thirdicon.src = database[currentId].thirdconsrc
    ultimateicon.src = database[currentId].ultimateiconsrc
    video.src = database[currentId].firstabilityvideo
    heroicon.src = database[currentId].heroicon
}

function changeurl(ability) {
    video.src = database[currentId][ability]
    
}

document.getElementById("firstabilitybutton").addEventListener("click", function(event) {
    event.preventDefault(); 
    changeurl("firstabilityvideo");    
    video.play()     
})
document.getElementById("secondabilitybutton").addEventListener("click", function(event) {
    event.preventDefault(); 
    changeurl("secondabilityvideo");    
    video.play()     
})
document.getElementById("thirdabilitybutton").addEventListener("click", function(event) {
    event.preventDefault(); 
    changeurl("thirdabilityvideo");    
    video.play()     
})
document.getElementById("ultimateabilitybutton").addEventListener("click", function(event) {
    event.preventDefault(); 
    changeurl("ultimateabilityvideo");    
    video.play()     
})
</script>
